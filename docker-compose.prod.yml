version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auremont}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecurepassword123}
      POSTGRES_DB: ${POSTGRES_DB:-auremont_prod}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal_network
    # Exposing DB to host is restricted to internal network for security
    # No ports mapping to public!

  backend:
    build:
      context: ./auremont-backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-auremont}:${POSTGRES_PASSWORD:-supersecurepassword123}@db:5432/${POSTGRES_DB:-auremont_prod}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-https://auremont.com}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
    depends_on:
      - db
    networks:
      - internal_network
      - proxy_network

  frontend:
    build:
      context: ./auremont-frontend
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.auremont.com}
    networks:
      - proxy_network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - proxy_network

networks:
  internal_network:
    driver: bridge
    internal: true # Database is strictly isolated from the outside world
  proxy_network:
    driver: bridge

volumes:
  db_data:
